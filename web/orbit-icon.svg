  <rect width="512" height="512" rx="116" fill="url(#bg)"/>
  <circle cx="256" cy="256" r="152" fill="none" stroke="#122e23" stroke-width="35" opacity=".42"/>
  <circle cx="256" cy="256" r="152" fill="none" stroke="url(#ring)" stroke-width="27" stroke-linecap="round" stroke-dasharray="855 100" transform="rotate(-42 256 256)"/>
  <circle cx="256" cy="256" r="89" fill="url(#core)" filter="url(#shadow)"/>
  <circle cx="362" cy="143" r="36" fill="url(#satellite)" filter="url(#shadow)"/>
