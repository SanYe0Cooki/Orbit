<!doctype html>
<html lang="zh-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6f7f2">
<title>Orbit — 每天一點點</title>
<meta name="description" content="Orbit — 一天一點點，把想做的事變成習慣。">
<link rel="canonical" href="app.html">
<meta http-equiv="refresh" content="0; url=app.html">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="orbit-icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<style>
:root{--ink:#20352d;--green:#315b49;--paper:#f6f7f2;--muted:#748078}
@media (prefers-color-scheme:dark){:root{--ink:#e8efe9;--green:#8fc4a6;--paper:#0e1a15;--muted:#9aa8a0}}
*{box-sizing:border-box}
body{margin:0;min-height:100dvh;display:grid;place-items:center;background:var(--paper);color:var(--ink);
font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",system-ui,sans-serif;text-align:center;padding:24px}
.mark{display:grid;place-items:center;width:72px;height:72px;margin:0 auto 18px;border-radius:24px;background:var(--green);color:#fff;font-size:34px}
h1{font-size:26px;letter-spacing:-1px;margin:0 0 6px}
p{color:var(--muted);font-size:14px;margin:0 0 18px}
a{display:inline-block;background:var(--green);color:#fff;text-decoration:none;padding:12px 22px;border-radius:999px;font-weight:700}
</style>
</head>
<body>
  <main>
    <div class="mark">◌</div>
    <h1>Orbit</h1>
    <p>一天一點點，把想做的事變成習慣。</p>
    <a href="app.html">開啟 Orbit</a>
  </main>
  <script>location.replace('app.html');</script>
</body>
</html>
