name: Build iOS

# Runs on a free GitHub-hosted macOS runner, so you do not need a Mac.
#
# WITHOUT signing secrets this produces a simulator build (.app). It proves the
# project compiles and can be run in Xcode's Simulator — it cannot be installed
# on a real iPhone and cannot be uploaded to App Store Connect.
#
# WITH signing secrets it produces a real IPA:
#   APPLE_TEAM_ID                 10-character team id from developer.apple.com
#   APPLE_CERT_P12_BASE64         base64 of your Apple Distribution .p12
#   APPLE_CERT_PASSWORD           password of that .p12
#   APPLE_PROVISION_PROFILE_BASE64 base64 of your .mobileprovision
#   KEYCHAIN_PASSWORD             any random string, used for the temp keychain

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'ios/**'
      - 'package.json'
      - 'capacitor.config.json'
      - 'scripts/**'
      - '.github/workflows/ios.yml'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Build mode'
        required: true
        default: 'auto'
        type: choice
        options: [auto, unsigned, signed]

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: iOS ${{ github.ref_name }}
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Select Xcode
        run: |
          sudo xcode-select -switch "$(ls -d /Applications/Xcode*.app | sort -V | tail -n 1)/Contents/Developer"
          xcodebuild -version

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Sync web assets into the native project
        run: npx cap sync ios

      - name: Install CocoaPods dependencies
        working-directory: ios/App
        run: |
          if [ -f Podfile ]; then
            pod install --repo-update
          else
            echo "No Podfile found in ios/App."
            exit 1
          fi

      - name: Set build number
        run: |
          VERSION_NAME=$(node -p "require('./package.json').version")
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=${{ github.run_number }}" >> "$GITHUB_ENV"
          PBX=ios/App/App.xcodeproj/project.pbxproj
          # MARKETING_VERSION / CURRENT_PROJECT_VERSION lines all share one id (24 hex chars).
          perl -0pi -e "s/(MARKETING_VERSION = )[^;]+;/\${1}$VERSION_NAME;/g" "$PBX"
          perl -0pi -e "s/(CURRENT_PROJECT_VERSION = )[^;]+;/\${1}$BUILD_NUMBER;/g" "$PBX"
          grep -c "MARKETING_VERSION = $VERSION_NAME" "$PBX" || true

      - name: Decide signing mode
        id: mode
        env:
          APPLE_CERT_P12_BASE64: ${{ secrets.APPLE_CERT_P12_BASE64 }}
          APPLE_PROVISION_PROFILE_BASE64: ${{ secrets.APPLE_PROVISION_PROFILE_BASE64 }}
        run: |
          REQUESTED="${{ github.event.inputs.mode }}"
          if [ "$REQUESTED" = "signed" ]; then
            MODE=signed
          elif [ "$REQUESTED" = "unsigned" ]; then
            MODE=unsigned
          elif [ -n "$APPLE_CERT_P12_BASE64" ] && [ -n "$APPLE_PROVISION_PROFILE_BASE64" ]; then
            MODE=signed
          else
            MODE=unsigned
          fi
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "Signing mode: $MODE"

      # ---------- signed path ----------
      - name: Import certificate and provisioning profile
        if: steps.mode.outputs.mode == 'signed'
        env:
          APPLE_CERT_P12_BASE64: ${{ secrets.APPLE_CERT_P12_BASE64 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          APPLE_PROVISION_PROFILE_BASE64: ${{ secrets.APPLE_PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN=$RUNNER_TEMP/orbit.keychain-db
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 1800 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"

          echo "$APPLE_CERT_P12_BASE64" | base64 -d > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$APPLE_CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$APPLE_PROVISION_PROFILE_BASE64" | base64 -d > "$RUNNER_TEMP/profile.mobileprovision"
          cp "$RUNNER_TEMP/profile.mobileprovision" ~/Library/MobileDevice/Provisioning\ Profiles/

          PROFILE_UUID=$(security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" | plutil -extract UUID raw -)
          PROFILE_NAME=$(security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" | plutil -extract Name raw -)
          echo "PROFILE_UUID=$PROFILE_UUID" >> "$GITHUB_ENV"
          echo "PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_ENV"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          echo "Imported profile: $PROFILE_NAME ($PROFILE_UUID)"

      - name: Build archive (signed)
        if: steps.mode.outputs.mode == 'signed'
        run: |
          set -euo pipefail
          xcodebuild -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -archivePath "$RUNNER_TEMP/Orbit.xcarchive" \
            -allowProvisioningUpdates \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            DEVELOPMENT_TEAM="${{ secrets.APPLE_TEAM_ID }}" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            clean archive

      - name: Export IPA
        if: steps.mode.outputs.mode == 'signed'
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          node scripts/write-export-options.mjs "$RUNNER_TEMP/exportOptions.plist"
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Orbit.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/exportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates
          mkdir -p dist
          find "$RUNNER_TEMP/export" -name "*.ipa" -exec cp {} dist/ \;
          ls -lh dist

      # ---------- unsigned path ----------
      - name: Build for the Simulator (unsigned)
        if: steps.mode.outputs.mode == 'unsigned'
        run: |
          set -euo pipefail
          xcodebuild -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build
          mkdir -p dist
          APP_PATH=$(find "$RUNNER_TEMP/DerivedData/Build/Products" -maxdepth 2 -name "*.app" -print -quit)
          echo "Built: $APP_PATH"
          test -n "$APP_PATH"
          ditto -c -k --keepParent "$APP_PATH" dist/Orbit-simulator-unsigned.zip
          ls -lh dist

      - name: Upload iOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: orbit-ios-${{ steps.mode.outputs.mode }}-${{ github.run_number }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30
